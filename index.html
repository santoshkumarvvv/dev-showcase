<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Store</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .app-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
        .app-info h3 { margin: 0 0 5px 0; color: #3498db; }
        .app-info p { margin: 0; font-size: 14px; color: #666; }
        .download-btn { background: #27ae60; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .download-btn:hover { background: #219653; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 My App Store</h1>
        <p style="text-align: center; color: #666;">यहाँ से आप सीधे ऐप डाउनलोड कर सकते हैं</p>
        
        <div class="app-item">
            <div class="app-info">
                <h3>MyApp.apk</h3>
                <p>Android App</p>
            </div>
            <a href="MyApp.apk" class="download-btn">Download</a>
        </div>
    </div>
</body>
</html>
